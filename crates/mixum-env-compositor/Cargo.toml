[package]
name = "mixum-env-compositor"
description = "MixumART in-container Wayland compositor: forwards per-surface buffers + damage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mixum-env-surface = { workspace = true }
serde_json.workspace = true

# Wayland 只在 Linux 上编译：源码已经用 `#[cfg(target_os = "linux")] mod linux`
# 门控，依赖也必须跟着门控，否则 Windows/macOS 上 `cargo test --workspace`
# 会去编译 wayland-sys 并失败。
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "xwayland"] }
png = "0.17"
x11rb = { version = "0.13", features = ["xtest"] }
xim = { version = "0.5", features = ["x11rb-server"] }
