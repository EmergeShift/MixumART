name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust check
        run: cargo check --workspace
      - name: Rust tests
        run: cargo test -p mixum-env-core -p mixum-env-map -p mixum-cli -p mixum-browser
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
