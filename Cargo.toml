[workspace]
resolver = "2"
members = [
  "crates/mixum-env-core",
  "crates/mixum-env-runtime-apple",
  "crates/mixum-env-runtime-docker",
  "crates/mixum-env-runtime-wsl2",
  "crates/mixum-env-surface",
  "crates/mixum-env-compositor",
  "crates/mixum-env-display",
  "crates/mixum-env-map",
  "apps/desktop/src-tauri",
  "crates/mixum-cli",
  "crates/mixum-setup",
  "crates/mixum-browser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/EmergeShift/MixumART"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "macros", "rt", "rt-multi-thread", "net", "sync", "fs", "io-util"] }
tokio-tungstenite = { version = "0.27", features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
url = "2"
ulid = "1"
dirs = "6"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
portable-pty = "0.9"
toml_edit = "0.22"
ureq = { version = "2", features = ["json", "tls"] }
semver = "1"

mixum-env-core = { path = "crates/mixum-env-core" }
mixum-env-runtime-apple = { path = "crates/mixum-env-runtime-apple" }
mixum-env-runtime-docker = { path = "crates/mixum-env-runtime-docker" }
mixum-env-runtime-wsl2 = { path = "crates/mixum-env-runtime-wsl2" }
mixum-env-surface = { path = "crates/mixum-env-surface" }
mixum-env-compositor = { path = "crates/mixum-env-compositor" }
mixum-env-display = { path = "crates/mixum-env-display" }
mixum-env-map = { path = "crates/mixum-env-map" }
mixum-setup = { path = "crates/mixum-setup" }
