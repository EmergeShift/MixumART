[workspace]
resolver = "2"
members = [
  "crates/mixum-env-core",
  "crates/mixum-env-runtime-apple",
  "crates/mixum-env-runtime-docker",
  "crates/mixum-env-runtime-wsl2",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ashreo/mixum-Agent-Env"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "macros", "rt", "rt-multi-thread"] }

mixum-env-core = { path = "crates/mixum-env-core" }
mixum-env-runtime-apple = { path = "crates/mixum-env-runtime-apple" }
mixum-env-runtime-docker = { path = "crates/mixum-env-runtime-docker" }
mixum-env-runtime-wsl2 = { path = "crates/mixum-env-runtime-wsl2" }
